<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de jogos – Mapas mentais · Educação Física 8º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --papel:#faf8f0;--pauta:#b0c8e2;--margem:#d68a8a;
    --tinta:#1a2a70;--tinta2:#26388a;--vermelha:#a82430;
    --marca:rgba(255,226,96,.55);--certo:#12704f;--errado:#b3261e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:repeating-linear-gradient(to bottom,transparent 0 47px,var(--pauta) 47px 48px),var(--papel);
    font-family:"Patrick Hand","Comic Sans MS",cursive;color:var(--tinta);
    font-size:19px;line-height:48px;padding:24px 18px 60px 26px;
  }
  body::before{content:"";position:fixed;top:0;bottom:0;left:52px;width:2px;background:var(--margem);opacity:.85}
  .folha{max-width:1020px;margin:0 auto}
  h1{font-family:"Caveat",cursive;font-weight:700;font-size:46px;line-height:1.1;margin:8px 0 2px;
     background:linear-gradient(transparent 62%,var(--marca) 62%);display:inline}
  .sub{margin:6px 0 4px;color:var(--tinta2)}
  .resumo{font-family:"Caveat",cursive;font-size:26px;color:var(--vermelha);line-height:1.4;margin:0 0 14px}
  .cartoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:8px}
  .cartao{border:2px solid var(--tinta2);border-radius:20px;background:#fdf7dd;padding:14px 18px 18px;line-height:1.35}
  .cartao h2{font-family:"Caveat",cursive;font-size:32px;margin:0;line-height:1.2}
  .cartao p{margin:6px 0 12px;font-size:18px;color:var(--tinta2)}
  .barra{height:14px;border:2px solid var(--tinta2);border-radius:10px;background:#fff;overflow:hidden}
  .barra i{display:block;height:100%;background:var(--certo);width:0}
  .estado{font-size:17px;color:var(--tinta2);margin:6px 0 12px;line-height:1.3}
  .abas{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 18px}
  .aba{font-family:"Caveat",cursive;font-size:25px;font-weight:600;background:transparent;
       border:2px solid var(--tinta2);border-radius:14px;padding:2px 16px;color:var(--tinta2);cursor:pointer;line-height:1.5}
  .aba[aria-selected="true"]{background:var(--vermelha);border-color:var(--vermelha);color:#fff8f2}
  .mapa{display:grid;grid-template-columns:1fr 250px 1fr;gap:0 34px;align-items:center;margin-bottom:8px;position:relative}
  .coluna{display:flex;flex-direction:column;gap:18px;justify-content:center}
  .fios{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .fios path{fill:none;stroke:var(--tinta2);stroke-width:2.5;stroke-linecap:round}
  .centro{text-align:center;align-self:center;position:relative;z-index:1;
    border:3px solid var(--vermelha);border-radius:22px;background:#fde6de;padding:14px 10px;
    font-family:"Caveat",cursive;font-weight:700;font-size:28px;line-height:1.15;color:var(--vermelha)}
  .ramo{border:2px solid var(--tinta2);border-radius:20px;padding:10px 14px 14px;background:#fdf7dd;position:relative;z-index:1;
        flex:1;display:flex;flex-direction:column}
  .ramo h2{font-family:"Caveat",cursive;font-size:26px;font-weight:700;margin:0 0 6px;line-height:1.2}
  .vaga{display:block;width:100%;text-align:left;min-height:38px;line-height:1.3;border:2px dashed var(--tinta2);
        border-radius:12px;background:rgba(255,255,255,.6);margin:6px 0;padding:6px 10px;font:inherit;font-size:18px;
        color:var(--tinta);cursor:pointer}
  .vaga.vazia{color:#8792b8}
  .vaga.certo{border-color:var(--certo);border-style:solid;color:var(--certo);background:rgba(18,112,79,.1)}
  .vaga.errado{border-color:var(--errado);border-style:solid;color:var(--errado);background:rgba(179,38,30,.08)}
  .banco{border-top:2px solid var(--pauta);margin-top:18px;padding-top:10px}
  .banco h2{font-family:"Caveat",cursive;font-size:28px;margin:0 0 6px}
  .fichas{display:flex;flex-wrap:wrap;gap:10px}
  .ficha{font:inherit;font-size:18px;line-height:1.3;color:var(--tinta);border:2px solid var(--tinta);
         border-radius:14px;background:#fffdf5;padding:6px 12px;cursor:pointer}
  .ficha.escolhida{background:var(--vermelha);border-color:var(--vermelha);color:#fff8f2;transform:rotate(-1.2deg)}
  .acoes{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
  .acao{font-family:"Caveat",cursive;font-size:26px;font-weight:600;line-height:1.4;border:2px solid var(--tinta);
        border-radius:14px;background:#fffdf5;color:var(--tinta);padding:2px 18px;cursor:pointer}
  .acao.principal{background:var(--tinta);color:var(--papel)}
  .placar{font-family:"Caveat",cursive;font-size:26px;color:var(--vermelha);line-height:1.4}
  .ficha:focus-visible,.vaga:focus-visible,.aba:focus-visible,.acao:focus-visible{outline:3px solid var(--vermelha);outline-offset:2px}
  @media (max-width:760px){
    body{padding-left:22px}
    body::before{left:14px}
    .mapa{grid-template-columns:1fr;gap:16px 0}
    .centro{order:-1}
    .coluna{gap:16px}
    .fios{display:none}
  }
</style>
</head>
<body>
<div class="folha" id="tela"></div>

<script>
const DADOS = [{"tri": "1º trimestre", "conteudos": "Esportes de invasão · Lutas pelo mundo", "mapas": [{"centro": "ESPORTES DE INVASÃO", "ramos": [{"nome": "Características gerais", "itens": ["Dois times", "Pontos no campo do adversário", "Cooperação entre jogadores"]}, {"nome": "Princípios táticos", "itens": ["Ataque", "Defesa", "Transição"]}, {"nome": "Benefícios", "itens": ["Desenvolvimento motor", "Socialização", "Regras e disciplina"]}, {"nome": "Exemplos", "itens": ["Futsal", "Basquete", "Handebol"]}]}, {"centro": "LUTAS PELO MUNDO", "ramos": [{"nome": "Tipos de luta", "itens": ["Judô", "Capoeira", "Muay Thai"]}, {"nome": "Valores que ensina", "itens": ["Disciplina", "Respeito", "Estratégia"]}, {"nome": "Benefícios físicos", "itens": ["Força e resistência", "Coordenação motora", "Flexibilidade e agilidade"]}, {"nome": "Benefícios mentais", "itens": ["Redução do estresse", "Concentração e foco", "Autoconfiança"]}]}]}, {"tri": "2º trimestre", "conteudos": "Ginástica de conscientização corporal · Ginástica de condicionamento físico", "mapas": [{"centro": "GINÁSTICA DE CONSCIENTIZAÇÃO CORPORAL", "ramos": [{"nome": "O que promove", "itens": ["Percepção dos movimentos", "Percepção da respiração", "Harmonia entre corpo e mente"]}, {"nome": "Exemplos", "itens": ["Yoga", "Pilates", "Alongamento"]}, {"nome": "Fundamentos básicos", "itens": ["Controle da postura", "Controle respiratório", "Respeito aos limites"]}, {"nome": "Benefícios", "itens": ["Melhora da postura", "Redução de tensões", "Aumento da flexibilidade"]}]}, {"centro": "GINÁSTICA DE CONDICIONAMENTO FÍSICO", "ramos": [{"nome": "Capacidades físicas", "itens": ["Força", "Resistência", "Agilidade"]}, {"nome": "Onde praticar", "itens": ["Academias", "Escolas", "Espaços públicos"]}, {"nome": "Exemplos", "itens": ["Musculação", "Spinning", "Treinamento HIIT"]}, {"nome": "Fundamentos técnicos", "itens": ["Postura correta", "Respiração adequada", "Progressão"]}]}]}, {"tri": "3º trimestre", "conteudos": "Dança de salão · Práticas corporais de aventura na natureza", "mapas": [{"centro": "DANÇA DE SALÃO", "ramos": [{"nome": "Principais ritmos", "itens": ["Forró", "Tango", "Zouk"]}, {"nome": "Onde é praticada", "itens": ["Festas", "Bailes", "Academias"]}, {"nome": "Características", "itens": ["Praticada em pares", "Comunicação não verbal", "Lúdica e expressiva"]}, {"nome": "Desenvolve", "itens": ["Coordenação motora", "Ritmo e equilíbrio", "Interação social"]}]}, {"centro": "PRÁTICAS CORPORAIS DE AVENTURA NA NATUREZA", "ramos": [{"nome": "Cuidados e riscos", "itens": ["Conhecer o local", "Guias capacitados", "Equipamentos de proteção"]}, {"nome": "Educação ambiental", "itens": ["Não deixar lixo", "Trilhas demarcadas", "Ecoturismo sustentável"]}, {"nome": "Práticas", "itens": ["Escalada em rocha", "Rafting", "Arvorismo"]}, {"nome": "Equipamentos", "itens": ["Cordas e mosquetões", "Capacete", "Colete salva-vidas"]}]}]}];
const PROGRESSO = DADOS.map(t => t.mapas.map(() => null));   // {certos,total} por mapa
let tri = null, atual = 0, escolhida = null;

const el = (t,c,txt) => { const e=document.createElement(t); if(c) e.className=c; if(txt!==undefined) e.textContent=txt; return e; };
const embaralhar = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(p=>p[1]);
const totalVagas = m => m.ramos.reduce((s,r)=>s+r.itens.length,0);

/* ---------------------------------------------------------------- painel */
function painel(){
  tri = null;
  const tela = document.getElementById('tela');
  tela.innerHTML = '';
  tela.appendChild(el('h1', null, 'Painel de jogos – mapas mentais'));
  tela.appendChild(el('p','sub','Educação Física · 8º ano · complete os mapas mentais das apostilas'));

  let certos=0, possiveis=0, prontos=0;
  DADOS.forEach((t,i)=>t.mapas.forEach((m,j)=>{
    possiveis += totalVagas(m);
    const p = PROGRESSO[i][j];
    if(p){ certos += p.certos; if(p.certos===p.total) prontos++; }
  }));
  tela.appendChild(el('p','resumo','Acertos no total: '+certos+' de '+possiveis+'  ·  mapas completos: '+prontos+' de 6'));

  const grade = el('div','cartoes');
  DADOS.forEach((t,i)=>{
    const c = el('div','cartao');
    c.appendChild(el('h2',null,t.tri));
    c.appendChild(el('p',null,t.conteudos));
    const feitos = PROGRESSO[i].reduce((s,p)=>s+(p?p.certos:0),0);
    const tot = t.mapas.reduce((s,m)=>s+totalVagas(m),0);
    const barra = el('div','barra'); const preenchida = el('i');
    preenchida.style.width = Math.round(feitos/tot*100)+'%';
    barra.appendChild(preenchida); c.appendChild(barra);
    c.appendChild(el('div','estado', feitos ? feitos+' de '+tot+' palavras certas · 2 mapas' : 'ainda não jogado · 2 mapas'));
    const b = el('button','acao principal', feitos ? 'Continuar' : 'Jogar');
    b.onclick = ()=>{ tri=i; atual=0; jogo(); };
    c.appendChild(b);
    grade.appendChild(c);
  });
  tela.appendChild(grade);
}

/* ------------------------------------------------------------------ jogo */
function jogo(){
  escolhida = null;
  const t = DADOS[tri], mapa = t.mapas[atual];
  const tela = document.getElementById('tela');
  tela.innerHTML = '';

  const voltar = el('button','acao','← Painel');
  voltar.onclick = painel;
  tela.appendChild(voltar);

  tela.appendChild(el('h1',null,'Complete o mapa mental'));
  tela.appendChild(el('p','sub', t.tri + ' · ' + t.conteudos));
  tela.appendChild(el('p','sub','Toque numa palavra da caixa e depois no espaço em branco do ramo. Para tirar, toque na palavra já colocada.'));

  const abas = el('div','abas');
  t.mapas.forEach((m,i)=>{
    const b = el('button','aba','Mapa '+(i+1)+': '+m.centro.toLowerCase());
    b.setAttribute('aria-selected', i===atual);
    b.onclick = ()=>{ atual=i; jogo(); };
    abas.appendChild(b);
  });
  tela.appendChild(abas);

  const grade = el('div','mapa');
  const esq = el('div','coluna'), dir = el('div','coluna');
  mapa.ramos.forEach((r,ri)=>{
    const naEsquerda = ri % 2 === 0;
    const card = el('div','ramo '+(naEsquerda?'esq':'dir'));
    card.appendChild(el('h2',null,r.nome));
    r.itens.forEach((_,si)=>{
      const v = el('button','vaga vazia','. . . . . . . . . .');
      v.dataset.ramo=ri; v.dataset.vaga=si; v.dataset.valor='';
      v.onclick = ()=>tocarVaga(v);
      card.appendChild(v);
    });
    (naEsquerda?esq:dir).appendChild(card);
  });
  grade.appendChild(esq);
  grade.appendChild(el('div','centro',mapa.centro));
  grade.appendChild(dir);
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','fios');
  grade.appendChild(svg);
  tela.appendChild(grade);

  const banco = el('div','banco');
  banco.appendChild(el('h2',null,'Caixa de palavras'));
  const fichas = el('div','fichas'); fichas.id='banco';
  banco.appendChild(fichas);
  tela.appendChild(banco);

  const acoes = el('div','acoes');
  const conf = el('button','acao principal','Conferir'); conf.onclick = conferir;
  const limpa = el('button','acao','Recomeçar'); limpa.onclick = jogo;
  const placar = el('span','placar'); placar.id='placar';
  acoes.appendChild(conf); acoes.appendChild(limpa); acoes.appendChild(placar);
  tela.appendChild(acoes);

  embaralhar(mapa.ramos.flatMap(r=>r.itens)).forEach(txt=>fichas.appendChild(criarFicha(txt)));
  requestAnimationFrame(desenharFios);
}

function criarFicha(txt){
  const f = el('button','ficha',txt);
  f.onclick = ()=>{
    if(escolhida===f){ f.classList.remove('escolhida'); escolhida=null; return; }
    document.querySelectorAll('.ficha.escolhida').forEach(x=>x.classList.remove('escolhida'));
    f.classList.add('escolhida'); escolhida=f;
  };
  return f;
}

function tocarVaga(v){
  document.getElementById('placar').textContent='';
  v.classList.remove('certo','errado');
  if(v.dataset.valor){
    document.getElementById('banco').appendChild(criarFicha(v.dataset.valor));
    v.dataset.valor=''; v.textContent='. . . . . . . . . .'; v.classList.add('vazia');
    requestAnimationFrame(desenharFios);
    return;
  }
  if(!escolhida) return;
  v.dataset.valor = escolhida.textContent;
  v.textContent = escolhida.textContent;
  v.classList.remove('vazia');
  escolhida.remove(); escolhida=null;
  requestAnimationFrame(desenharFios);
}

function conferir(){
  const mapa = DADOS[tri].mapas[atual];
  let certos=0,total=0,vazias=0;
  document.querySelectorAll('.vaga').forEach(v=>{
    total++;
    v.classList.remove('certo','errado');
    if(!v.dataset.valor){ vazias++; return; }
    const ok = mapa.ramos[+v.dataset.ramo].itens.includes(v.dataset.valor);
    v.classList.add(ok?'certo':'errado');
    if(ok) certos++;
  });
  PROGRESSO[tri][atual] = {certos:certos, total:total};
  const p = document.getElementById('placar');
  if(vazias) p.textContent = 'Acertos: '+certos+' de '+total+' — ainda faltam '+vazias+'.';
  else if(certos===total) p.textContent = 'Mapa completo! '+certos+' de '+total+'. 🎉';
  else p.textContent = 'Acertos: '+certos+' de '+total+'. Tire as palavras em vermelho e tente de novo.';
}

function desenharFios(){
  const grade = document.querySelector('.mapa');
  const svg = grade && grade.querySelector('.fios');
  const centro = grade && grade.querySelector('.centro');
  if(!svg || !centro) return;
  const base = grade.getBoundingClientRect();
  svg.setAttribute('viewBox','0 0 '+base.width+' '+base.height);
  svg.innerHTML='';
  if(window.innerWidth<=760) return;
  const c = centro.getBoundingClientRect();
  const cy = c.top + c.height/2 - base.top;
  grade.querySelectorAll('.ramo').forEach(card=>{
    const r = card.getBoundingClientRect();
    const esquerda = card.classList.contains('esq');
    const x1 = (esquerda ? r.right : r.left) - base.left;
    const y1 = r.top + r.height/2 - base.top;
    const x2 = (esquerda ? c.left : c.right) - base.left;
    const mx = (x1+x2)/2;
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d','M '+x1+' '+y1+' C '+mx+' '+y1+', '+mx+' '+cy+', '+x2+' '+cy);
    svg.appendChild(p);
  });
}

window.addEventListener('resize',desenharFios);
document.fonts && document.fonts.ready.then(desenharFios);
painel();
</script>
</body>
</html>
