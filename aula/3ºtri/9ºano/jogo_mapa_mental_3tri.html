<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complete o mapa mental – Educação Física · 8º ano · 3º trimestre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --papel:#faf8f0;
    --pauta:#b0c8e2;
    --margem:#d68a8a;
    --tinta:#1a2a70;
    --tinta2:#26388a;
    --caneta-vermelha:#a82430;
    --marca:rgba(255,226,96,.55);
    --certo:#12704f;
    --errado:#b3261e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      repeating-linear-gradient(to bottom, transparent 0 47px, var(--pauta) 47px 48px),
      var(--papel);
    font-family:"Patrick Hand", "Comic Sans MS", cursive;
    color:var(--tinta);
    font-size:19px;
    line-height:48px;
    padding:24px 18px 60px 26px;
  }
  body::before{
    content:"";position:fixed;top:0;bottom:0;left:52px;width:2px;background:var(--margem);opacity:.85;
  }
  .folha{max-width:1000px;margin:0 auto}
  h1{
    font-family:"Caveat", cursive;font-weight:700;font-size:44px;line-height:1.1;
    margin:8px 0 2px;letter-spacing:.5px;
    background:linear-gradient(transparent 62%, var(--marca) 62%);display:inline;
  }
  .sub{font-size:19px;color:var(--tinta2);margin:6px 0 0}
  .como{margin:0 0 10px;color:var(--tinta2)}
  .abas{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 18px}
  .aba{
    font-family:"Caveat",cursive;font-size:26px;font-weight:600;
    background:transparent;border:2px solid var(--tinta2);border-radius:14px;
    padding:2px 16px;color:var(--tinta2);cursor:pointer;line-height:1.5;
  }
  .aba[aria-selected="true"]{background:var(--caneta-vermelha);border-color:var(--caneta-vermelha);color:#fff8f2}
  .mapa{display:grid;grid-template-columns:1fr 250px 1fr;gap:0 34px;align-items:center;margin-bottom:8px;position:relative}
  .fios{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .fios path{fill:none;stroke:var(--tinta2);stroke-width:2.5;stroke-linecap:round}
  .coluna{display:flex;flex-direction:column;gap:18px;justify-content:center}
  .centro{
    text-align:center;align-self:center;position:relative;z-index:1;background-clip:padding-box;
    border:3px solid var(--caneta-vermelha);border-radius:22px;
    background:#fde6de;padding:14px 10px;
    font-family:"Caveat",cursive;font-weight:700;font-size:28px;line-height:1.15;color:var(--caneta-vermelha);
  }
  .ramo{border:2px solid var(--tinta2);border-radius:20px;padding:10px 14px 14px;background:#fdf7dd;position:relative;z-index:1}
  .ramo h2{font-family:"Caveat",cursive;font-size:26px;font-weight:700;margin:0 0 6px;line-height:1.2}
  .ramo{flex:1;display:flex;flex-direction:column;justify-content:flex-start}
  .vaga{
    display:block;width:100%;text-align:left;min-height:38px;line-height:1.3;
    border:2px dashed var(--tinta2);border-radius:12px;background:rgba(255,255,255,.5);
    margin:6px 0;padding:6px 10px;font:inherit;font-size:18px;color:var(--tinta);cursor:pointer;
  }
  .vaga.vazia{color:#8792b8}
  .vaga.alvo{border-style:solid;background:rgba(255,226,96,.5)}
  .vaga.certo{border-color:var(--certo);border-style:solid;color:var(--certo);background:rgba(18,112,79,.1)}
  .vaga.errado{border-color:var(--errado);border-style:solid;color:var(--errado);background:rgba(179,38,30,.08)}
  .banco{border-top:2px solid var(--pauta);margin-top:18px;padding-top:10px}
  .banco h2{font-family:"Caveat",cursive;font-size:28px;margin:0 0 6px}
  .fichas{display:flex;flex-wrap:wrap;gap:10px}
  .ficha{
    font:inherit;font-size:18px;line-height:1.3;color:var(--tinta);
    border:2px solid var(--tinta);border-radius:14px;background:#fffdf5;
    padding:6px 12px;cursor:pointer;
  }
  .ficha.escolhida{background:var(--caneta-vermelha);border-color:var(--caneta-vermelha);color:#fff8f2;transform:rotate(-1.2deg)}
  .ficha:focus-visible,.vaga:focus-visible,.aba:focus-visible,.acao:focus-visible{outline:3px solid var(--caneta-vermelha);outline-offset:2px}
  .acoes{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
  .acao{
    font-family:"Caveat",cursive;font-size:26px;font-weight:600;line-height:1.4;
    border:2px solid var(--tinta);border-radius:14px;background:#fffdf5;color:var(--tinta);
    padding:2px 18px;cursor:pointer;
  }
  .acao.principal{background:var(--tinta);color:var(--papel)}
  .placar{font-family:"Caveat",cursive;font-size:26px;color:var(--caneta-vermelha);line-height:1.4}
  @media (max-width:760px){
    body{padding-left:22px}
    body::before{left:14px}
    .mapa{grid-template-columns:1fr;gap:16px 0}
    .centro{order:-1}
    .coluna{gap:16px}
    .fios{display:none}
  }
</style>
</head>
<body>
<div class="folha">
  <h1>Complete o mapa mental</h1>
  <p class="sub">Educação Física · 8º ano · 3º trimestre</p>
  <p class="como">Escolha uma palavra da caixa e toque no espaço em branco do ramo onde ela se encaixa. Para tirar, toque na palavra já colocada.</p>

  <div class="abas" role="tablist" id="abas"></div>
  <div id="mapa"></div>

  <div class="banco">
    <h2>Caixa de palavras</h2>
    <div class="fichas" id="banco"></div>
  </div>

  <div class="acoes">
    <button class="acao principal" id="conferir">Conferir</button>
    <button class="acao" id="limpar">Recomeçar</button>
    <span class="placar" id="placar"></span>
  </div>
</div>

<script>
const MAPAS = [{"centro": "DANÇA DE SALÃO", "ramos": [{"nome": "Principais ritmos", "itens": ["Forró", "Tango", "Zouk"]}, {"nome": "Onde é praticada", "itens": ["Festas", "Bailes", "Academias"]}, {"nome": "Características", "itens": ["Praticada em pares", "Comunicação não verbal", "Lúdica e expressiva"]}, {"nome": "Desenvolve", "itens": ["Coordenação motora", "Ritmo e equilíbrio", "Interação social"]}]}, {"centro": "LUTAS PELO MUNDO", "ramos": [{"nome": "Tipos de luta", "itens": ["Boxe", "Taekwondo", "Wrestling"]}, {"nome": "Valores que ensina", "itens": ["Disciplina", "Respeito", "Estratégia"]}, {"nome": "Benefícios físicos", "itens": ["Melhora da força", "Controle do peso corporal", "Reflexos rápidos"]}, {"nome": "Benefícios mentais", "itens": ["Redução do estresse", "Controle emocional", "Autoconfiança"]}]}];
let atual = 0, escolhida = null;

const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt !== undefined) e.textContent = txt; return e; };
const embaralhar = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(p => p[1]);

function montarAbas() {
  const box = document.getElementById('abas');
  box.innerHTML = '';
  MAPAS.forEach((m, i) => {
    const b = el('button', 'aba', 'Mapa ' + (i + 1) + ': ' + m.centro.toLowerCase());
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', i === atual);
    b.onclick = () => { atual = i; montar(); };
    box.appendChild(b);
  });
}

function montar() {
  escolhida = null;
  document.getElementById('placar').textContent = '';
  montarAbas();
  const mapa = MAPAS[atual];
  const área = document.getElementById('mapa');
  área.innerHTML = '';
  const grade = el('div', 'mapa');
  const esq = el('div', 'coluna'), dir = el('div', 'coluna');
  mapa.ramos.forEach((r, ri) => {
    const naEsquerda = ri % 2 === 0;              // ramos alternam: 1 esq, 2 dir, 3 esq...
    const card = el('div', 'ramo ' + (naEsquerda ? 'esq' : 'dir'));
    card.appendChild(el('h2', null, r.nome));
    r.itens.forEach((_, si) => {
      const v = el('button', 'vaga vazia', '. . . . . . . . . .');
      v.dataset.ramo = ri; v.dataset.vaga = si; v.dataset.valor = '';
      v.onclick = () => tocarVaga(v);
      card.appendChild(v);
    });
    (naEsquerda ? esq : dir).appendChild(card);
  });
  grade.appendChild(esq);
  const noCentral = el('div', 'centro', mapa.centro);
  grade.appendChild(noCentral);
  grade.appendChild(dir);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'fios');
  grade.appendChild(svg);
  área.appendChild(grade);
  requestAnimationFrame(desenharFios);

  const banco = document.getElementById('banco');
  banco.innerHTML = '';
  embaralhar(mapa.ramos.flatMap(r => r.itens)).forEach(txt => banco.appendChild(criarFicha(txt)));
}

function criarFicha(txt) {
  const f = el('button', 'ficha', txt);
  f.onclick = () => {
    if (escolhida === f) { f.classList.remove('escolhida'); escolhida = null; return; }
    document.querySelectorAll('.ficha.escolhida').forEach(x => x.classList.remove('escolhida'));
    f.classList.add('escolhida');
    escolhida = f;
  };
  return f;
}

function tocarVaga(v) {
  document.getElementById('placar').textContent = '';
  v.classList.remove('certo', 'errado');
  if (v.dataset.valor) {
    document.getElementById('banco').appendChild(criarFicha(v.dataset.valor));
    v.dataset.valor = '';
    v.textContent = '. . . . . . . . . .';
    v.classList.add('vazia');
    requestAnimationFrame(desenharFios);
    return;
  }
  if (!escolhida) return;
  v.dataset.valor = escolhida.textContent;
  v.textContent = escolhida.textContent;
  v.classList.remove('vazia');
  escolhida.remove();
  escolhida = null;
  requestAnimationFrame(desenharFios);
}

document.getElementById('conferir').onclick = () => {
  const mapa = MAPAS[atual];
  let certos = 0, total = 0, vazias = 0;
  document.querySelectorAll('.vaga').forEach(v => {
    total++;
    v.classList.remove('certo', 'errado');
    if (!v.dataset.valor) { vazias++; return; }
    const ok = mapa.ramos[+v.dataset.ramo].itens.includes(v.dataset.valor);
    v.classList.add(ok ? 'certo' : 'errado');
    if (ok) certos++;
  });
  const p = document.getElementById('placar');
  if (vazias) { p.textContent = 'Acertos: ' + certos + ' de ' + total + ' — ainda faltam ' + vazias + '.'; }
  else if (certos === total) { p.textContent = 'Mapa completo! ' + certos + ' de ' + total + '. 🎉'; }
  else { p.textContent = 'Acertos: ' + certos + ' de ' + total + '. Tire as palavras em vermelho e tente de novo.'; }
};

function desenharFios() {
  const grade = document.querySelector('.mapa');
  const svg = grade && grade.querySelector('.fios');
  const centro = grade && grade.querySelector('.centro');
  if (!svg || !centro) return;
  const base = grade.getBoundingClientRect();
  svg.setAttribute('viewBox', '0 0 ' + base.width + ' ' + base.height);
  svg.innerHTML = '';
  if (window.innerWidth <= 760) return;
  const c = centro.getBoundingClientRect();
  const cy = c.top + c.height / 2 - base.top;
  grade.querySelectorAll('.ramo').forEach(card => {
    const r = card.getBoundingClientRect();
    const esquerda = card.classList.contains('esq');
    const x1 = (esquerda ? r.right : r.left) - base.left;
    const y1 = r.top + r.height / 2 - base.top;
    const x2 = (esquerda ? c.left : c.right) - base.left;
    const mx = (x1 + x2) / 2;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', 'M ' + x1 + ' ' + y1 + ' C ' + mx + ' ' + y1 + ', ' + mx + ' ' + cy + ', ' + x2 + ' ' + cy);
    svg.appendChild(p);
  });
}

window.addEventListener('resize', desenharFios);
document.fonts && document.fonts.ready.then(desenharFios);
document.getElementById('limpar').onclick = montar;
montar();
</script>
</body>
</html>
