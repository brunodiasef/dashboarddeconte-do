<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complete o mapa mental — 9º ano, 1º trimestre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --papel:#fbf9f1; --pauta:#b0c7de; --margem:#d68a8a;
    --tinta:#1a2f6b; --tinta2:#213a7a; --vermelho:#a62b2b;
    --verde:#165c44; --marca:#ffe880;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:0 0 60px;
    font-family:'Kalam','Comic Sans MS',cursive;
    color:var(--tinta);
    background:var(--papel);
    background-image:repeating-linear-gradient(to bottom,transparent 0 37px,var(--pauta) 37px 39px);
    background-position:0 96px;
  }
  .margem{position:fixed;top:0;bottom:0;left:38px;width:6px;border-left:2px solid var(--margem);border-right:2px solid #e6afaf;pointer-events:none}
  .folha{max-width:960px;margin:0 auto;padding:26px 18px 0 62px}
  header{padding:14px 0 6px}
  h1{font-size:1.6rem;font-weight:700;margin:0 0 2px;color:var(--vermelho);line-height:1.25}
  .instrucao{margin:0;font-size:1.05rem;line-height:39px}
  .placar{font-size:1rem;color:var(--tinta2);line-height:39px}
  section.mapa{margin:26px 0 10px;padding-top:8px}
  h2{font-size:1.15rem;margin:0 0 6px;color:var(--tinta2);text-decoration:underline;text-underline-offset:5px}
  .quadro{position:relative;display:grid;grid-template-columns:1fr minmax(150px,240px) 1fr;gap:14px 26px;align-items:center;margin:10px 0 6px}
  .quadro svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .col{display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
  .nucleo{
    position:relative;z-index:1;text-align:center;font-weight:700;color:var(--vermelho);
    border:3px solid var(--vermelho);border-radius:18px;background:#fff6f0;padding:14px 10px;line-height:1.2;
  }
  .vaga{
    min-height:64px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;
    text-align:center;border:2px solid var(--tinta2);border-radius:14px;background:#fffdf6;
    padding:8px 10px;font-size:.95rem;line-height:1.25;cursor:pointer;color:var(--tinta);
  }
  .rotulo{font-weight:700}
  .lacuna{
    display:block;min-width:130px;padding:2px 8px;border-bottom:2px dashed #91a7c9;color:#7d8fae;
  }
  .vaga.cheia .lacuna{border-bottom-style:solid;border-bottom-color:var(--tinta2);color:var(--tinta)}
  .vaga.alvo{background:var(--marca)}
  .vaga.certa{border-color:var(--verde);color:var(--verde);background:#f2fbf6}
  .vaga.certa .lacuna{color:var(--verde);border-bottom-color:var(--verde)}
  .vaga.errada{border-color:var(--vermelho);color:var(--vermelho);background:#fff4f4}
  .vaga.errada .lacuna{color:var(--vermelho);border-bottom-color:var(--vermelho)}
  .banco{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
  .peca{
    border:2px solid var(--tinta2);border-radius:12px;background:#fffdf6;padding:8px 12px;
    font-family:inherit;font-size:.95rem;color:var(--tinta);cursor:grab;line-height:1.2;text-align:left;
  }
  .peca.selecionada{background:var(--marca);border-color:var(--vermelho)}
  .peca:focus-visible,.vaga:focus-visible,button:focus-visible{outline:3px solid var(--vermelho);outline-offset:2px}
  .acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
  button.cmd{
    font-family:inherit;font-size:1rem;border:2px solid var(--tinta2);border-radius:12px;
    background:#fffdf6;color:var(--tinta2);padding:7px 16px;cursor:pointer;
  }
  button.cmd.principal{border-color:var(--vermelho);color:var(--vermelho)}
  .aviso{font-size:1rem;min-height:26px}
  .aviso.ok{color:var(--verde)}
  .aviso.ops{color:var(--vermelho)}
  @media (max-width:700px){
    body{background-image:none}
    .margem{display:none}
    .folha{padding:18px 16px}
    .quadro{grid-template-columns:1fr}
    .quadro svg{display:none}
    .nucleo{order:-1}
  }
  @media (prefers-reduced-motion:no-preference){
    .vaga,.peca{transition:background-color .15s ease,border-color .15s ease}
  }
</style>
</head>
<body>
<div class="margem"></div>
<div class="folha">
  <header>
    <h1>Complete o mapa mental — 9º ano, 1º trimestre</h1>
    <p class="instrucao">Cada ramo já traz o começo da anotação. Arraste a continuação certa para a linha em branco — no celular, toque na opção e depois na linha.</p>
    <p class="placar" id="placar"></p>
  </header>
  <div id="mapas"></div>
</div>
<script>
const DADOS = {"titulo": "Complete o mapa mental — 9º ano, 1º trimestre", "mapas": [{"centro": "LUTAS PELO MUNDO", "ramos": [["Judô:", "originado no Japão. Ensina valores como disciplina e respeito."], ["Boxe:", "tem raízes na Grécia Antiga, mas foi modernizado na Inglaterra."], ["Capoeira:", "mistura de dança e luta, é uma expressão cultural única do Brasil."], ["Muay Thai (Tailândia):", "punhos, cotovelos, joelhos e pés"], ["Taekwondo (Coreia):", "golpes de perna rápidos"], ["Wrestling:", "luta livre, praticada em várias regiões"], ["Benefícios físicos:", "força, coordenação e flexibilidade"], ["Benefícios mentais:", "foco, autoconfiança e disciplina"]]}, {"centro": "ESPORTES DE REDE E PAREDE", "ramos": [["Rede:", "quadra dividida, sem contato físico"], ["Parede:", "parede frontal como alvo, espaço compartilhado"], ["Exemplos de rede:", "voleibol, tênis, badminton, tênis de mesa"], ["Exemplos de parede:", "squash e raquetebol"], ["Fundamentos:", "saque, recepção e rebatida"], ["Benefícios:", "coordenação, reflexo, estratégia e concentração"]]}]};
let selecionada = null;

function embaralhar(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function montarMapa(mapa, indice){
  const sec = document.createElement('section');
  sec.className = 'mapa';
  sec.innerHTML = `<h2>Mapa ${indice+1}: ${mapa.centro}</h2>`;

  const quadro = document.createElement('div');
  quadro.className = 'quadro';
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  quadro.appendChild(svg);

  const esq = document.createElement('div'); esq.className='col';
  const dir = document.createElement('div'); dir.className='col';
  const nucleo = document.createElement('div'); nucleo.className='nucleo'; nucleo.textContent = mapa.centro;

  mapa.ramos.forEach(([rotulo,texto],i)=>{
    const vaga = document.createElement('div');
    vaga.className='vaga';
    vaga.innerHTML='<span class="rotulo"></span><span class="lacuna"></span>';
    vaga.querySelector('.rotulo').textContent=rotulo;
    vaga.querySelector('.lacuna').textContent='__________';
    vaga.dataset.resposta=texto;
    vaga.tabIndex=0;
    vaga.addEventListener('click',()=>soltarNaVaga(vaga));
    vaga.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();soltarNaVaga(vaga);}});
    vaga.addEventListener('dragover',e=>{e.preventDefault();vaga.classList.add('alvo');});
    vaga.addEventListener('dragleave',()=>vaga.classList.remove('alvo'));
    vaga.addEventListener('drop',e=>{
      e.preventDefault(); vaga.classList.remove('alvo');
      const t = e.dataTransfer.getData('text/plain');
      const peca = sec.querySelector(`.peca[data-texto="${CSS.escape(t)}"]`);
      if(peca){ selecionada = peca; soltarNaVaga(vaga); }
    });
    (i%2===0?esq:dir).appendChild(vaga);
  });

  quadro.append(esq,nucleo,dir);
  sec.appendChild(quadro);

  const banco = document.createElement('div');
  banco.className='banco';
  embaralhar(mapa.ramos.map(r=>r[1])).forEach(texto=>{
    const peca=document.createElement('button');
    peca.type='button'; peca.className='peca'; peca.textContent=texto;
    peca.dataset.texto=texto; peca.draggable=true;
    peca.addEventListener('click',()=>{
      if(selecionada===peca){selecionada.classList.remove('selecionada');selecionada=null;return;}
      if(selecionada) selecionada.classList.remove('selecionada');
      selecionada=peca; peca.classList.add('selecionada');
    });
    peca.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',texto));
    banco.appendChild(peca);
  });
  sec.appendChild(banco);

  const acoes=document.createElement('div');
  acoes.className='acoes';
  const bConf=document.createElement('button');
  bConf.className='cmd principal'; bConf.type='button'; bConf.textContent='Conferir';
  const bLimpa=document.createElement('button');
  bLimpa.className='cmd'; bLimpa.type='button'; bLimpa.textContent='Recomeçar este mapa';
  const aviso=document.createElement('span'); aviso.className='aviso';
  acoes.append(bConf,bLimpa,aviso);
  sec.appendChild(acoes);

  bConf.addEventListener('click',()=>{
    const vagas=[...sec.querySelectorAll('.vaga')];
    if(vagas.some(v=>!v.classList.contains('cheia'))){
      aviso.className='aviso ops'; aviso.textContent='Ainda faltam linhas para completar.'; return;
    }
    let acertos=0;
    vagas.forEach(v=>{
      const ok = v.querySelector('.lacuna').textContent===v.dataset.resposta;
      v.classList.remove('certa','errada');
      v.classList.add(ok?'certa':'errada');
      if(ok) acertos++;
    });
    aviso.className = acertos===vagas.length?'aviso ok':'aviso ops';
    aviso.textContent = acertos===vagas.length
      ? 'Mapa completo, tudo certo!'
      : `${acertos} de ${vagas.length} no lugar certo. Toque nas linhas em vermelho para trocar.`;
    atualizarPlacar();
    desenhar();
  });

  bLimpa.addEventListener('click',()=>{
    sec.querySelectorAll('.vaga').forEach(v=>{
      v.querySelector('.lacuna').textContent='__________'; v.className='vaga';
    });
    sec.querySelectorAll('.peca').forEach(p=>{p.hidden=false;p.classList.remove('selecionada');});
    selecionada=null; aviso.textContent=''; aviso.className='aviso';
    atualizarPlacar(); desenhar();
  });

  return sec;
}

function soltarNaVaga(vaga){
  const lacuna = vaga.querySelector('.lacuna');
  if(vaga.classList.contains('cheia')){
    const devolver = lacuna.textContent;
    const sec = vaga.closest('.mapa');
    const peca = sec.querySelector(`.peca[data-texto="${CSS.escape(devolver)}"]`);
    if(peca) peca.hidden=false;
    lacuna.textContent='__________'; vaga.className='vaga';
    if(!selecionada){ atualizarPlacar(); desenhar(); return; }
  }
  if(!selecionada) return;
  lacuna.textContent = selecionada.dataset.texto;
  vaga.className='vaga cheia';
  selecionada.hidden = true;
  selecionada.classList.remove('selecionada');
  selecionada = null;
  atualizarPlacar();
  desenhar();
}

function atualizarPlacar(){
  const todas=[...document.querySelectorAll('.vaga')];
  const cheias=todas.filter(v=>v.classList.contains('cheia')).length;
  document.getElementById('placar').textContent=`Linhas completadas: ${cheias} de ${todas.length}`;
}

function desenhar(){
  document.querySelectorAll('.quadro').forEach(q=>{
    const svg=q.querySelector('svg');
    if(!svg || getComputedStyle(svg).display==='none') return;
    const r=q.getBoundingClientRect();
    svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);
    svg.innerHTML='';
    const n=q.querySelector('.nucleo').getBoundingClientRect();
    q.querySelectorAll('.vaga').forEach(v=>{
      const b=v.getBoundingClientRect();
      const esquerda = b.left < n.left;
      const x1=(esquerda?b.right:b.left)-r.left, y1=b.top+b.height/2-r.top;
      const x2=(esquerda?n.left:n.right)-r.left, y2=n.top+n.height/2-r.top;
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d',`M ${x1} ${y1} Q ${(x1+x2)/2} ${y1} ${x2} ${y2}`);
      p.setAttribute('fill','none'); p.setAttribute('stroke','#213a7a'); p.setAttribute('stroke-width','2.5');
      svg.appendChild(p);
    });
  });
}

const alvo=document.getElementById('mapas');
DADOS.mapas.forEach((m,i)=>alvo.appendChild(montarMapa(m,i)));
atualizarPlacar();
desenhar();
window.addEventListener('resize',desenhar);
document.fonts && document.fonts.ready.then(desenhar);
</script>
</body>
</html>
