<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Educação Física • 7º Ano • 2º Trimestre</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/cormorant-garamond@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/cormorant-garamond@latest/latin-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/cormorant-garamond@latest/latin-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/latin-500-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/latin-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/latin-700-normal.css">
<style>
  :root{
    --cream:#f5ecd7;
    --cream-2:#efe4c9;
    --brown-dark:#2c1810;
    --brown-mid:#4a2c1a;
    --brown-soft:#6b4430;
    --gold:#c9a961;
    --gold-2:#d4af37;
    --gold-dark:#a07d3a;
    --card:#ffffff;
    --text:#2c1810;
    --text-soft:#6b5540;
    --shadow:0 8px 24px rgba(44,24,16,.08);
    --shadow-lg:0 16px 40px rgba(44,24,16,.14);
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    background:var(--cream);
    color:var(--text);
    line-height:1.6;
    overflow-x:hidden;
    background-image:
      radial-gradient(circle at 10% 20%,rgba(201,169,97,.06) 0%,transparent 40%),
      radial-gradient(circle at 90% 80%,rgba(44,24,16,.04) 0%,transparent 40%);
  }
  .app{display:flex;min-height:100vh}
  .sidebar{
    width:280px;background:var(--brown-dark);color:#e8dcc0;
    padding:28px 20px;position:fixed;top:0;left:0;height:100vh;
    overflow-y:auto;z-index:50;transition:transform .35s cubic-bezier(.4,0,.2,1);
    box-shadow:4px 0 24px rgba(0,0,0,.2);
  }
  .sidebar::-webkit-scrollbar{width:6px}
  .sidebar::-webkit-scrollbar-thumb{background:var(--gold-dark);border-radius:3px}
  .brand{border-bottom:1px solid rgba(201,169,97,.3);padding-bottom:18px;margin-bottom:22px}
  .brand-school{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:4px}
  .brand-title{font-family:var(--serif);font-size:20px;font-weight:600;color:#f5ecd7;line-height:1.2}
  .brand-sub{font-size:11px;color:#b89968;margin-top:4px;letter-spacing:.5px}
  .progress-wrap{background:rgba(0,0,0,.3);border-radius:20px;padding:12px 14px;margin-bottom:20px}
  .progress-label{display:flex;justify-content:space-between;font-size:11px;color:#b89968;margin-bottom:6px;letter-spacing:1px;text-transform:uppercase}
  .progress-bar{height:6px;background:rgba(255,255,255,.1);border-radius:10px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));width:0%;transition:width .6s ease;border-radius:10px}
  .progress-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .stat{background:rgba(201,169,97,.1);border:1px solid rgba(201,169,97,.2);border-radius:8px;padding:8px;text-align:center}
  .stat-num{font-family:var(--serif);font-size:20px;color:var(--gold);font-weight:600}
  .stat-lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#b89968}
  .nav-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:16px 0 10px;font-weight:500}
  .lesson-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:all .25s;font-size:13px;color:#d6c8a5;margin-bottom:3px;user-select:none;border:1px solid transparent}
  .lesson-item:hover{background:rgba(201,169,97,.1);color:#f5ecd7}
  .lesson-item.active{background:linear-gradient(135deg,var(--gold-dark),var(--gold));color:#2c1810;font-weight:600;box-shadow:0 4px 12px rgba(201,169,97,.4)}
  .lesson-item.done{color:#f5ecd7}
  .lesson-item.done .lesson-num{background:var(--gold-dark);color:#fff}
  .lesson-num{width:26px;height:26px;border-radius:50%;background:rgba(201,169,97,.2);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:14px;font-weight:600;flex-shrink:0;transition:all .25s}
  .lesson-item.active .lesson-num{background:#2c1810;color:var(--gold)}
  .lesson-title{flex:1;line-height:1.3}
  .lesson-check{display:none;color:var(--gold);font-weight:700}
  .lesson-item.done .lesson-check{display:inline}
  .lesson-item.done .lesson-num-txt{display:none}

  .main{margin-left:280px;flex:1;padding:24px 40px 60px;min-height:100vh}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;padding-bottom:16px;border-bottom:2px solid rgba(201,169,97,.2)}
  .topbar-info{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .topbar-tag{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-dark);font-weight:600}
  .topbar-title{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--brown-dark)}
  .topbar-actions{display:flex;gap:8px;align-items:center}
  .btn-icon{background:transparent;border:1px solid var(--gold);width:40px;height:40px;border-radius:10px;color:var(--brown-dark);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s}
  .btn-icon:hover{background:var(--gold);color:#fff}
  .menu-toggle{display:none}

  .timeline{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;position:relative;padding:0 10px}
  .timeline::before{content:'';position:absolute;top:50%;left:30px;right:30px;height:2px;background:linear-gradient(90deg,var(--gold) 0%,var(--gold-dark) 50%,#d9c89a 100%);z-index:0}
  .tl-dot{width:44px;height:44px;border-radius:50%;background:#fff;border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:18px;font-weight:600;color:var(--gold-dark);cursor:pointer;position:relative;z-index:1;transition:all .3s;box-shadow:var(--shadow)}
  .tl-dot:hover{transform:scale(1.1);border-color:var(--gold-2)}
  .tl-dot.active{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#fff;border-color:var(--gold-2);box-shadow:0 0 0 6px rgba(201,169,97,.2),var(--shadow-lg);transform:scale(1.12)}
  .tl-dot.done{background:var(--gold-dark);color:#fff;border-color:var(--gold)}

  .screen{animation:fadeIn .5s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .hero{background:linear-gradient(135deg,#fff 0%,var(--cream-2) 100%);border-radius:20px;padding:60px 48px;text-align:center;box-shadow:var(--shadow-lg);border:1px solid rgba(201,169,97,.2);position:relative;overflow:hidden}
  .hero::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(201,169,97,.2),transparent 70%)}
  .hero-kicker{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--gold-dark);font-weight:600;margin-bottom:12px}
  .hero-title{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--brown-dark);line-height:1.1;margin-bottom:10px}
  .hero-period{font-size:18px;color:var(--brown-soft);font-weight:500;letter-spacing:2px;text-transform:uppercase;margin-bottom:22px}
  .hero-subtitle{font-family:var(--serif);font-size:22px;font-style:italic;color:var(--gold-dark);margin-bottom:18px}
  .hero-text{font-size:15px;color:var(--text-soft);max-width:640px;margin:0 auto 34px}
  .hero-cards{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:760px;margin:0 auto 34px}
  .hero-card{background:#fff;padding:24px;border-radius:16px;box-shadow:var(--shadow);border:2px solid transparent;transition:all .35s;cursor:pointer;position:relative;overflow:hidden;text-align:left}
  .hero-card:hover{border-color:var(--gold);transform:translateY(-4px);box-shadow:var(--shadow-lg)}
  .hero-card img{width:100%;height:180px;object-fit:cover;border-radius:12px;margin-bottom:14px}
  .hero-card-t{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--brown-dark);margin-bottom:6px}
  .hero-card-d{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-dark)}

  .module-cover{background-size:cover;background-position:center;color:var(--cream);border-radius:20px;padding:90px 48px;text-align:center;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;border:1px solid var(--gold)}
  .module-cover::before{content:'';position:absolute;inset:12px;border:1px solid rgba(201,169,97,.35);border-radius:14px;pointer-events:none}
  .module-tag{display:inline-block;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);font-weight:600;padding:6px 16px;border:1px solid var(--gold);border-radius:30px;margin-bottom:18px;background:rgba(44,24,16,.5)}
  .module-title{font-family:var(--serif);font-size:54px;font-weight:700;line-height:1.1;margin-bottom:16px;background:linear-gradient(135deg,var(--gold),#f3d77a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 18px rgba(0,0,0,.35)}
  .module-sub{font-size:15px;letter-spacing:3px;text-transform:uppercase;color:#f0e6cd}
  .module-sub span{color:var(--gold)}

  .sec-head{margin-bottom:28px;text-align:center}
  .sec-kick{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--gold-dark);font-weight:600;margin-bottom:8px}
  .sec-title{font-family:var(--serif);font-size:36px;font-weight:700;color:var(--brown-dark);margin-bottom:8px}
  .sec-desc{font-size:15px;color:var(--text-soft);max-width:660px;margin:0 auto}

  .grid{display:grid;gap:20px}
  .grid-2{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .grid-4{grid-template-columns:repeat(4,1fr)}

  .card{background:var(--card);border-radius:16px;padding:28px;box-shadow:var(--shadow);border:1px solid rgba(201,169,97,.1);transition:all .35s;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--gold)}
  .card-ico{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold-2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;margin-bottom:16px;box-shadow:0 6px 16px rgba(201,169,97,.3)}
  .card-t{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--brown-dark);margin-bottom:8px;line-height:1.2}
  .card-d{font-size:14px;color:var(--text-soft);line-height:1.55}
  .card-tag{display:inline-block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-dark);font-weight:600;margin-bottom:6px}

  .feat-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);transition:all .35s;border:1px solid rgba(201,169,97,.1);display:flex;flex-direction:column}
  .feat-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
  .feat-img{height:180px;overflow:hidden;position:relative;background:var(--cream-2)}
  .feat-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
  .feat-card:hover .feat-img img{transform:scale(1.07)}
  .feat-body{padding:20px 22px;display:flex;flex-direction:column;flex:1}
  .feat-kick{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-dark);font-weight:600;margin-bottom:4px}
  .feat-t{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--brown-dark);margin-bottom:10px}
  .feat-list{list-style:none;margin-bottom:14px}
  .feat-list li{font-size:13px;color:var(--text-soft);padding:3px 0;display:flex;align-items:flex-start;gap:8px}
  .feat-list li::before{content:'◆';color:var(--gold);font-size:8px;margin-top:6px}
  .btn{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#fff;border:none;padding:11px 22px;border-radius:10px;font-family:var(--sans);font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(201,169,97,.3);transition:all .25s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(201,169,97,.5)}
  .btn-ghost{background:transparent;color:var(--brown-dark);border:2px solid var(--gold);box-shadow:none}
  .btn-ghost:hover{background:var(--gold);color:#fff}
  .btn-block{display:block;width:100%;margin-top:10px}
  .mt-auto{margin-top:auto}

  .nav-btns{display:flex;justify-content:space-between;align-items:center;margin-top:40px;gap:14px;flex-wrap:wrap}

  .modal-bg{position:fixed;inset:0;background:rgba(44,24,16,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(6px)}
  .modal-bg.show{display:flex;animation:fadeIn .3s}
  .modal{background:#fff;border-radius:20px;max-width:680px;width:100%;max-height:88vh;overflow-y:auto;padding:36px;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:popIn .35s cubic-bezier(.4,0,.2,1)}
  @keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-close{position:absolute;top:14px;right:14px;background:var(--cream);border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--brown-dark);display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:2}
  .modal-close:hover{background:var(--gold);color:#fff}
  .modal-img{height:240px;background:var(--cream-2);border-radius:14px;overflow:hidden;margin-bottom:20px}
  .modal-img img{width:100%;height:100%;object-fit:cover}
  .modal h2{font-family:var(--serif);font-size:32px;color:var(--brown-dark);margin-bottom:6px}
  .modal-sub{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-dark);margin-bottom:18px}
  .modal-body h3{font-family:var(--serif);font-size:20px;color:var(--brown-dark);margin:18px 0 8px}
  .modal-body p{color:var(--text-soft);font-size:14px;margin-bottom:10px}
  .modal-body ul{list-style:none;margin:8px 0 14px}
  .modal-body ul li{padding:6px 0 6px 22px;position:relative;font-size:14px;color:var(--text-soft)}
  .modal-body ul li::before{content:'';position:absolute;left:0;top:12px;width:10px;height:10px;background:var(--gold);border-radius:50%}

  .quiz-box{background:#fff;border-radius:18px;padding:34px;box-shadow:var(--shadow);margin-bottom:20px}
  .quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--cream-2)}
  .quiz-count{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-dark);font-weight:600}
  .quiz-score{background:var(--cream);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;color:var(--brown-dark)}
  .quiz-q{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--brown-dark);margin-bottom:20px;line-height:1.35}
  .quiz-options{display:grid;gap:10px;margin-bottom:18px}
  .quiz-opt{background:#fff;border:2px solid #e8dcc0;border-radius:12px;padding:14px 18px;cursor:pointer;transition:all .2s;font-size:14px;color:var(--text);text-align:left;display:flex;align-items:center;gap:12px;font-family:var(--sans)}
  .quiz-opt:hover:not(:disabled){border-color:var(--gold);background:var(--cream);transform:translateX(4px)}
  .quiz-opt .opt-lbl{width:28px;height:28px;border-radius:50%;background:var(--cream-2);color:var(--brown-dark);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;flex-shrink:0}
  .quiz-opt.correct{background:#e8f5e9;border-color:#4caf50;color:#1b5e20}
  .quiz-opt.correct .opt-lbl{background:#4caf50;color:#fff}
  .quiz-opt.wrong{background:#ffebee;border-color:#f44336;color:#b71c1c}
  .quiz-opt.wrong .opt-lbl{background:#f44336;color:#fff}
  .quiz-opt:disabled{cursor:default}
  .quiz-feedback{padding:14px 18px;border-radius:12px;font-size:14px;margin-bottom:16px;display:none}
  .quiz-feedback.show{display:block;animation:fadeIn .3s}
  .quiz-feedback.ok{background:#e8f5e9;color:#1b5e20;border-left:4px solid #4caf50}
  .quiz-feedback.no{background:#ffebee;color:#b71c1c;border-left:4px solid #f44336}

  .mini-quiz{background:#fff;border-radius:16px;padding:30px;box-shadow:var(--shadow);margin-bottom:20px}
  .mini-char{background:linear-gradient(135deg,var(--cream-2),#e8d8b0);padding:22px;border-radius:12px;font-family:var(--serif);font-size:18px;font-style:italic;color:var(--brown-dark);margin-bottom:18px;text-align:center;min-height:80px;display:flex;align-items:center;justify-content:center}
  .mini-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

  .essay-box{background:#fff;border-radius:16px;padding:26px;box-shadow:var(--shadow);margin-bottom:18px}
  .essay-box h3{font-family:var(--serif);font-size:20px;color:var(--brown-dark);margin-bottom:10px}
  .essay-box p{color:var(--text-soft);font-size:14px;margin-bottom:12px;font-style:italic}
  .essay-box textarea{width:100%;min-height:100px;border:2px solid #e8dcc0;border-radius:10px;padding:12px;font-family:var(--sans);font-size:14px;color:var(--text);resize:vertical;background:var(--cream);transition:border-color .2s}
  .essay-box textarea:focus{outline:none;border-color:var(--gold);background:#fff}

  .result-card{background:linear-gradient(135deg,var(--brown-dark),var(--brown-mid));color:var(--cream);border-radius:20px;padding:46px;text-align:center;box-shadow:var(--shadow-lg);border:2px solid var(--gold)}
  .result-ico{font-size:80px;margin-bottom:16px}
  .result-title{font-family:var(--serif);font-size:36px;font-weight:700;background:linear-gradient(135deg,var(--gold),#f3d77a);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
  .result-score{font-family:var(--serif);font-size:72px;font-weight:700;color:var(--gold);line-height:1;margin:16px 0}
  .result-msg{font-size:16px;color:#d6c8a5;margin-bottom:24px}

  .badge{position:fixed;bottom:24px;right:24px;background:var(--brown-dark);color:var(--gold);padding:14px 22px;border-radius:40px;box-shadow:var(--shadow-lg);border:2px solid var(--gold);font-size:13px;font-weight:600;z-index:80;display:flex;align-items:center;gap:10px;transform:translateY(120px);transition:transform .4s}
  .badge.show{transform:translateY(0)}
  .badge-ico{font-size:22px}

  .review-section{background:#fff;border-radius:16px;padding:28px;box-shadow:var(--shadow);margin-bottom:22px}
  .review-section h3{font-family:var(--serif);font-size:26px;color:var(--brown-dark);margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid var(--gold)}

  .final{text-align:center;padding:60px 30px;background:linear-gradient(135deg,var(--brown-dark),var(--brown-mid));border-radius:20px;color:var(--cream);box-shadow:var(--shadow-lg);border:2px solid var(--gold)}
  .final h1{font-family:var(--serif);font-size:42px;font-weight:700;background:linear-gradient(135deg,var(--gold),#f3d77a);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px}
  .final p{font-size:16px;color:#d6c8a5;margin-bottom:24px}
  .trophies{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:26px 0}
  .trophy{background:rgba(201,169,97,.1);border:1px solid var(--gold);padding:16px 22px;border-radius:14px;min-width:160px}
  .trophy-ico{font-size:38px;margin-bottom:6px}
  .trophy-t{font-family:var(--serif);font-size:14px;color:var(--gold);letter-spacing:1px;text-transform:uppercase}

  .ach-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .ach{background:#fff;border-radius:14px;padding:18px;text-align:center;box-shadow:var(--shadow);border:2px solid transparent;transition:all .3s}
  .ach.unlocked{border-color:var(--gold);background:linear-gradient(135deg,#fff,var(--cream-2))}
  .ach.locked{opacity:.4;filter:grayscale(.8)}
  .ach-ico{font-size:40px;margin-bottom:6px}
  .ach-t{font-family:var(--serif);font-size:15px;color:var(--brown-dark);font-weight:600}
  .ach-d{font-size:11px;color:var(--text-soft);margin-top:4px}

  .reveal{opacity:0;transform:translateY(20px);transition:all .6s}
  .reveal.show{opacity:1;transform:none}
  .text-center{text-align:center}
  .mt-30{margin-top:30px}
  .hidden{display:none !important}

  button:focus-visible,a:focus-visible,.lesson-item:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  @media(max-width:980px){
    .grid-4{grid-template-columns:repeat(2,1fr)}

function toast(msg,ico="⭐"){

  setTimeout(()=>$("#badge").classList.remove("show"),2600);

  $("#modalBg").classList.remove("show");
  document.body.style.overflow = "";
}

/* ================= NAVEGAÇÃO ================= */
function renderNav(){
  const nav1=$("#navList1"), nav2=$("#navList2");
  nav1.innerHTML=""; nav2.innerHTML="";
  LESSONS.forEach((l,i)=>{
    const el=document.createElement("div");
    el.className="lesson-item"+(state.current===i?" active":"")+(state.done.has(i)?" done":"");
    el.tabIndex=0;
    el.innerHTML=`<div class="lesson-num"><span class="lesson-num-txt">${l.id}</span><span class="lesson-check">✓</span></div><div class="lesson-title">${l.title}</div>`;
    el.onclick=()=>goTo(i);
    el.onkeydown=e=>{ if(e.key==="Enter") goTo(i); };
    (l.module===1?nav1:nav2).appendChild(el);
  });
  document.querySelectorAll("[data-nav='review']").forEach(el=>{ el.onclick=()=>goToReview(); });
}
function renderTimeline(){
  const tl=$("#timeline"); tl.innerHTML="";
  LESSONS.forEach((l,i)=>{
    const dot=document.createElement("div");
    dot.className="tl-dot"+(state.current===i?" active":"")+(state.done.has(i)?" done":"");
    dot.textContent=l.id; dot.tabIndex=0;
    dot.setAttribute("aria-label","Ir para a aula "+l.id);
    dot.onclick=()=>goTo(i);
    tl.appendChild(dot);
  });
}
function goTo(i){
  if(i<0||i>=LESSONS.length) return;
  state.current=i; render();
  $("#sidebar").classList.remove("open");
  window.scrollTo({top:0,behavior:"smooth"});
}
function goToHome(){ state.current=-2; render(); $("#sidebar").classList.remove("open"); window.scrollTo({top:0,behavior:"smooth"}); }
function goToReview(){ state.current=-1; render(); $("#sidebar").classList.remove("open"); window.scrollTo({top:0,behavior:"smooth"}); }

function render(){
  renderNav(); renderTimeline();
  const screen=$("#screen"), navBtns=$("#navBtns");
  const lesson = state.current>=0 ? LESSONS[state.current] : null;

  if(state.current===-2){
    $("#topTag").textContent="EDUCAÇÃO FÍSICA • 7º ANO";
    $("#topTitle").textContent="2º Trimestre";
    screen.innerHTML=renderHome();
    navBtns.innerHTML=`<span></span><button class="btn" onclick="goTo(0)">Começar Aula →</button>`;
    revealAll(); return;
  }
  if(state.current===-1){
    $("#topTag").textContent="REVISÃO";
    $("#topTitle").textContent="Revisão Final do Trimestre";
    screen.innerHTML=renderReview();
    navBtns.innerHTML=`<button class="btn btn-ghost" onclick="goTo(7)">← Voltar</button><button class="btn" onclick="goToFinal()">Tela Final ✨</button>`;
    revealAll(); return;
  }

  $("#topTag").textContent=lesson.tag;
  $("#topTitle").textContent=lesson.title;

  const map={
    "intro-stc":renderIntroSTC,"modalities":renderModalities,"skills":renderSkills,
    "activity-stc":renderActivitySTC,"intro-lutas":renderIntroLutas,"lutas":renderLutas,
    "provides":renderProvides,"final-quiz":renderFinalQuiz
  };
  screen.innerHTML=map[lesson.type]();

  const hasPrev=state.current>0, hasNext=state.current<LESSONS.length-1;
  navBtns.innerHTML=`
    ${hasPrev?`<button class="btn btn-ghost" id="prevBtn">← Aula Anterior</button>`:`<button class="btn btn-ghost" onclick="goToHome()">← Início</button>`}
    ${hasNext?`<button class="btn" id="nextBtn">Próxima Aula →</button>`:`<button class="btn" onclick="goToReview()">Ir para Revisão →</button>`}`;
  if(hasPrev) $("#prevBtn").onclick=()=>goTo(state.current-1);
  if(hasNext) $("#nextBtn").onclick=()=>goTo(state.current+1);

  if(!state.done.has(state.current)){
    const idx=state.current;
    setTimeout(()=>{
      if(state.current!==idx) return;
      state.done.add(idx); addPoints(5); checkAchievements();
      renderNav(); renderTimeline();
    },1500);
  }
  revealAll();
}
function revealAll(){
  setTimeout(()=>{ document.querySelectorAll(".reveal").forEach(el=>setTimeout(()=>el.classList.add("show"),80)); },40);
}

  else{ fb.className="quiz-feedback no show"; fb.innerHTML=`❌ Tente novamente mentalmente. A resposta correta é <strong>${q.opts[q.ans]}</strong>.`; }
};

function renderFinalQuiz(){
  return `
  <section class="screen">
    <div class="sec-head reveal">
      <div class="sec-kick">Módulo 2 • Aula 8</div>
      <h2 class="sec-title">Quiz Final do Trimestre</h2>
      <p class="sec-desc">Responda as 10 questões e descubra sua pontuação. Boa sorte!</p>
    </div>
    <div class="reveal">
      ${QUIZ.map((q,i)=>`
        <div class="quiz-box">
          <div class="quiz-head">
            <div class="quiz-count">Questão ${i+1} de ${QUIZ.length}</div>
            <div class="quiz-score" id="qzScore${i}">—</div>
          </div>
          <div class="quiz-q">${q.q}</div>
          <div class="quiz-options">
            ${q.opts.map((o,j)=>`
              <button class="quiz-opt" id="qz${i}_${j}" onclick="answerQuiz(${i},${j})">
                <span class="opt-lbl">${String.fromCharCode(65+j)}</span><span>${o}</span>
              </button>`).join("")}
          </div>
          <div class="quiz-feedback" id="qz${i}_fb"></div>
        </div>`).join("")}
    </div>
    <div class="reveal" id="finalResult" style="display:none;margin-top:30px">
      <div class="result-card">
        <div class="result-ico" id="resIco">🏆</div>
        <div class="result-title" id="resTitle">Resultado Final</div>
        <div class="result-score"><span id="resCorrect">0</span>/10</div>
        <div style="font-size:18px;color:var(--gold);margin-bottom:10px" id="resPct">0%</div>
        <div class="result-msg" id="resMsg"></div>
        <button class="btn" onclick="goToReview()">Ver Revisão →</button>
      </div>
    </div>
  </section>`;
}
window.answerQuiz=function(i,j){
  if(state.quizAnswered.has(i)) return;
  state.quizAnswered.add(i);
  const q=QUIZ[i], ok=(j===q.ans), fb=$(`#qz${i}_fb`);
  for(let k=0;k<q.opts.length;k++){
    const b=$(`#qz${i}_${k}`); b.disabled=true;
    if(k===q.ans) b.classList.add("correct");
    else if(k===j) b.classList.add("wrong");
  }
  const sc=$(`#qzScore${i}`);
  if(ok){
    fb.className="quiz-feedback ok show"; fb.innerHTML=`✅ Correto! ${q.exp}`;
    state.quizScore++; addPoints(10);
    sc.textContent="✓ Correta"; sc.style.background="#e8f5e9"; sc.style.color="#1b5e20";
  }else{
    fb.className="quiz-feedback no show"; fb.innerHTML=`❌ Incorreto. ${q.exp}`;
    sc.textContent="✗ Incorreta"; sc.style.background="#ffebee"; sc.style.color="#b71c1c";
  }
  if(state.quizAnswered.size===QUIZ.length){ setTimeout(showFinalResult,600); checkAchievements(); }
};
function showFinalResult(){
  const c=state.quizScore, pct=Math.round((c/QUIZ.length)*100);
  $("#resCorrect").textContent=c; $("#resPct").textContent=pct+"%";
  let ,t,m;
  if(pct===100){i="🏆";t="Mestre Absoluto!";m="Perfeito! Você dominou todo o conteúdo do trimestre.";}
  else if(pct>=80){i="🥇";t="Excelente!";m="Ótimo desempenho! Você tem um ótimo domínio do conteúdo.";}
  else if(pct>=60){i="🥈";t="Muito Bem!";m="Bom resultado! Continue revisando para melhorar ainda mais.";}
  else if(pct>=40){i="🥉";t="Esforço Reconhecido!";m="Continue estudando! A prática leva à maestria.";}
  else{i="📚";t="Hora de Revisar!";m="Reveja o conteúdo e tente novamente. Você consegue!";}
  $("#resIco").textContent=i; $("#resTitle").textContent=t; $("#resMsg").textContent=m;
  $("#finalResult").style.display="block";
  setTimeout(()=>$("#finalResult").scrollIntoView({behavior:"smooth",block:"center"}),100);
}

function renderReview(){
  return `
  <section class="screen">
    <div class="sec-head reveal">
      <div class="sec-kick">Revisão</div>
      <h2 class="sec-title">Revisão do Trimestre</h2>
      <p class="sec-desc">Os principais conceitos estudados nos dois módulos.</p>
    </div>

    <div class="review-section reveal">
      <h3>🤸 Esportes Técnico-Combinatórios</h3>
      <div class="grid grid-3" style="margin-top:14px">
        <div class="card"><div class="card-ico">🎯</div><div class="card-t">Conceito</div><div class="card-d">Combinam elementos técnicos e estéticos, com sequências coordenadas, fluidez, precisão, controle e ritmo.</div></div>
        <div class="card"><div class="card-ico">🏅</div><div class="card-t">Exemplos</div><div class="card-d">Ginástica (artística e rítmica), patinação artística, esqui, nado artístico e skate.</div></div>
        <div class="card"><div class="card-ico">⚖️</div><div class="card-t">Regras</div><div class="card-d">Avaliação por juízes, penalidades, tempo limite e elementos obrigatórios.</div></div>
      </div>
    </div>

    <div class="review-section reveal">
      <h3>🥋 Lutas do Brasil</h3>
      <div class="grid grid-3" style="margin-top:14px">
        <div class="card"><div class="card-ico">🤸</div><div class="card-t">Capoeira</div><div class="card-d">Brasil (influência africana) • dança, acrobacias e música.</div></div>
        <div class="card"><div class="card-ico">🥋</div><div class="card-t">Jiu-Jitsu</div><div class="card-d">Japão / Brasil • técnicas de chão.</div></div>
        <div class="card"><div class="card-ico">🥋</div><div class="card-t">Judô</div><div class="card-d">Japão • projeções e imobilizações; respeito e disciplina.</div></div>
        <div class="card"><div class="card-ico">🌍</div><div class="card-t">Influências</div><div class="card-d">Tradições indígenas, artes marciais africanas e europeias.</div></div>
        <div class="card"><div class="card-ico">💚</div><div class="card-t">Proporciona</div><div class="card-d">Respeito, disciplina, controle emocional, condicionamento, superação e trabalho em equipe.</div></div>
        <div class="card"><div class="card-ico">🦺</div><div class="card-t">Segurança</div><div class="card-d">Equipamentos, supervisão qualificada, respeito às regras e nunca com violência.</div></div>
      </div>
    </div>

    <div class="review-section reveal">
      <h3>🏆 Suas Conquistas</h3>
      <div class="ach-grid" style="margin-top:14px">
        ${ACHIEVEMENTS.map(a=>{
          const u=state.achievements.has(a.id);
          return `<div class="ach ${u?"unlocked":"locked"}"><div class="ach-ico">${a.ico}</div><div class="ach-t">${a.name}</div><div class="ach-d">${a.desc}</div></div>`;
        }).join("")}
      </div>
    </div>
  </section>`;
}

function goToFinal(){
  const screen=$("#screen");
  $("#topTag").textContent="CONCLUSÃO";
  $("#topTitle").textContent="Parabéns! Você concluiu!";
  const pct=Math.round((state.quizScore/QUIZ.length)*100);
  screen.innerHTML=`
  <section class="screen">
    <div class="final">
      <div style="font-size:80px;margin-bottom:10px">🎉</div>
      <h1>PARABÉNS! VOCÊ CONCLUIU O 2º TRIMESTRE</h1>
      <p>Esportes Técnico-Combinatórios + Lutas do Brasil</p>
      <div style="font-family:var(--serif);font-size:22px;color:var(--gold);margin:14px 0">Pontuação Final: ${state.points} pontos</div>
      <div style="font-family:var(--serif);font-size:18px;color:#d6c8a5;margin-bottom:24px">Quiz: ${state.quizScore}/${QUIZ.length} (${pct}%)</div>
      <div class="trophies">
        ${ACHIEVEMENTS.map(a=>{
          const u=state.achievements.has(a.id);
          return `<div class="trophy" style="${u?"":"opacity:.3"}"><div class="trophy-ico">${a.ico}</div><div class="trophy-t">${a.name}</div></div>`;
        }).join("")}
      </div>
      <p style="max-width:540px;margin:20px auto;font-style:italic">"Técnica, estética, respeito e tradição: o movimento do corpo é cultura e história. Parabéns pela jornada!"</p>
      <button class="btn" onclick="restart()" style="margin-top:10px">↻ Recomeçar</button>
    </div>
  </section>`;
  $("#navBtns").innerHTML="";
}

function restart(){
  if(!confirm("Tem certeza que deseja reiniciar toda a apresentação?")) return;
  state.current=-2; state.done=new Set(); state.points=0; state.quizScore=0;
  state.quizAnswered=new Set(); state.achievements=new Set(["start"]);
  state.miniStcAnswered=new Set(); state.miniLutasAnswered=new Set();
  updateStats(); render();
}

/* ================= INIT ================= */
$("#menuToggle").onclick=()=>$("#sidebar").classList.toggle("open");
$("#restartBtn").onclick=restart;
document.addEventListener("click",e=>{
  if(window.innerWidth<=768 && $("#sidebar").classList.contains("open")){
    if(!e.target.closest(".sidebar") && !e.target.closest("#menuToggle")) $("#sidebar").classList.remove("open");
  }
});
updateStats();
render();
setTimeout(()=>toast("Bem-vindo à aula! 🎓","🚀"),500);
</script>
</body>
</html>
